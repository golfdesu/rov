services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_DRAFT_ONLY: "true"
    restart: unless-stopped
    environment:
      - ROV_ENV=production
      - ROV_DB_PATH=/app/db/rov_app.db
      - ROV_TRUSTED_PROXIES=private,loopback
      - ROV_GOOGLE_CLIENT_ID=${ROV_GOOGLE_CLIENT_ID:-}
      - ROV_GOOGLE_CLIENT_SECRET=${ROV_GOOGLE_CLIENT_SECRET:-}
      - ROV_GOOGLE_REDIRECT_URI=${ROV_GOOGLE_REDIRECT_URI:-}
      - ROV_DISCORD_CLIENT_ID=${ROV_DISCORD_CLIENT_ID:-}
      - ROV_DISCORD_CLIENT_SECRET=${ROV_DISCORD_CLIENT_SECRET:-}
      - ROV_DISCORD_REDIRECT_URI=${ROV_DISCORD_REDIRECT_URI:-}
    volumes:
      - rov_db_data:/app/db
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  rov_db_data:
  caddy_data:
  caddy_config:
