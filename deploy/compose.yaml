services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_DRAFT_ONLY: "true"
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
    restart: unless-stopped
    environment:
      - ROV_ENV=production
      - ROV_DB_PATH=/app/db/rov_app.db
      - ROV_TRUSTED_PROXIES=private,loopback
      - ROV_GOOGLE_CLIENT_ID=${ROV_GOOGLE_CLIENT_ID:-}
      - ROV_GOOGLE_CLIENT_SECRET=${ROV_GOOGLE_CLIENT_SECRET:-}
      - ROV_GOOGLE_REDIRECT_URI=${ROV_GOOGLE_REDIRECT_URI:-}
      - ROV_DISCORD_CLIENT_ID=${ROV_DISCORD_CLIENT_ID:-}
      - ROV_DISCORD_CLIENT_SECRET=${ROV_DISCORD_CLIENT_SECRET:-}
      - ROV_DISCORD_REDIRECT_URI=${ROV_DISCORD_REDIRECT_URI:-}
      - ROV_ADMIN_USERNAMES=${ROV_ADMIN_USERNAMES:-}
      - ROV_CF_API_TOKEN=${ROV_CF_API_TOKEN:-}
      - ROV_CF_ACCOUNT_ID=${ROV_CF_ACCOUNT_ID:-}
      - ROV_CF_ZONE_ID=${ROV_CF_ZONE_ID:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - ROV_STRIPE_LIVE_ENABLED=${ROV_STRIPE_LIVE_ENABLED:-true}
      - ROV_FREE_PROMO_UNTIL=${ROV_FREE_PROMO_UNTIL:-2026-12-07T00:00:00+07:00}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-1}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-1}
      - ROV_TORCH_NUM_THREADS=${ROV_TORCH_NUM_THREADS:-1}
    volumes:
      - rov_db_data:/app/db
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  rov_db_data:
  caddy_data:
  caddy_config:
